<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10251e">
  <title>Green Rain Forest Time</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene" aria-hidden="true">
    <video class="photo" src="assets/rain-forest.webm" autoplay muted loop playsinline preload="auto"></video>
    <div class="sky-tint"></div>
    <div class="stars"></div>
    <div class="sun-track"><div class="sun"></div></div>
    <div class="moon"></div>
    <div class="shade"></div>
  </div>
  <main class="stage">
    <p class="eyebrow">Sunrise to sunset, live</p>
    <div class="clock" role="img" aria-label="Analog clock showing local time">
      <div class="bezel">
        <div class="dial" id="dial">
          <span class="brand">CHRONO</span>
          <span class="sub">QUARTZ &middot; LOCAL TIME</span>
          <div class="hand hour" id="hourHand"></div>
          <div class="hand minute" id="minuteHand"></div>
          <div class="hand second" id="secondHand"></div>
          <div class="pin"></div>
          <div class="glass"></div>
        </div>
      </div>
    </div>
    <div class="panel">
      <time id="digital" class="digital"></time>
      <p id="date" class="date"></p>
      <p class="local-note"><span></span> Your local time &middot; <b id="phase">day</b></p>
    </div>
  </main>
  <p class="credit">Video: "Forest in mist and rain" via <a href="https://commons.wikimedia.org/wiki/File:From_the_mountain_high,_the_forest_stretches_like_a_green_ocean,_kissed_by_mist_and_rain_%E2%80%94_a_silent_breath_of_nature,_and_continue_with_move_on.webm">Wikimedia Commons</a>, CC BY 4.0</p>
  <script src="script.js"></script>
</body>
</html>
